<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Mobs do Minecraft</title>

    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Minecraft', sans-serif;
            background-image: url(fundo-minecraft-png.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-shadow: 2px 2px 0px black;
        }

        /* Container principal */
        .container {
            width: 80%;
            margin: 40px auto;
        }

        /* Card */
        .card {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8);
            border: 4px solid #3c8527;
            margin-bottom: 30px;
            padding: 20px;
            box-shadow: 0 0 20px black;
        }

        /* Imagem grande */
        .card img {
            width: 180px;
            margin-right: 30px;
        }

        /* Texto */
        .card-content {
            text-align: left;
        }

        .card-content h2 {
            margin: 0 0 10px 0;
            color: #55ff55;
            font-size: 28px;
        }

        .card-content p {
            font-size: 18px;
        }

        /* Container dos botões no final da página, centralizados */
        .botao-voltar {
            display: flex;
            flex-direction: column;
            /* empilha os links verticalmente */
            align-items: center;
            /* centraliza horizontalmente */
            gap: 20px;
            /* espaço entre os links */
            margin: 40px 0 60px 0;
            /* espaço acima e abaixo */
        }

        /* Estilo dos links para parecerem cards */
        .botao-voltar a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            /* largura uniforme */
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            text-decoration: none;
            border: 4px solid #3c8527;
            box-shadow: 0 0 20px black;
            font-family: 'Minecraft', sans-serif;
            font-size: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        /* Efeito hover igual aos cards */
        .botao-voltar a:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="porco-head.png">
            <div class="card-content">
                <h2>🐷 Porco</h2>
                <p>Animal pacífico que fornece comida.</p>
            </div>
        </div>

        <div class="card">
            <img src="zombie-head.jpg">
            <div class="card-content">
                <h2>🧟 Zumbi</h2>
                <p>Criatura hostil que aparece à noite.</p>
            </div>
        </div>

        <div class="card">
            <img src="esqueleto-head.jpg">
            <div class="card-content">
                <h2>💀 Esqueleto</h2>
                <p>Inimigo que ataca com arco e flecha. Também aparece à noite.</p>
            </div>
        </div>

        <div class="card">
            <img src="ender-dragon.jpg">
            <div class="card-content">
                <h2>🐉 Ender Dragon</h2>
                <p>O chefe final do jogo, encontrado no End.</p>
            </div>
        </div>

    </div>
    <br />

    </div>
    <div class="botao-voltar">
        <a href="../index.html">⬅ Voltar</a>
        <a href="../imagens-biomas/biomas.html">Conheça os Biomas</a>
    </div>

</body>

</html>
